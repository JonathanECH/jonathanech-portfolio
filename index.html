<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0E14" />
    <meta
      name="description"
      content="Jonathan Campos — Desarrollador Web Frontend y Arquitecto de Software. Portafolio de ingeniería, auditoría técnica y casos de estudio."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Jonathan Campos — Frontend &amp; Software Architect</title>
    <script>
      ;(() => {
        try {
          const raw = localStorage.getItem('ech:preferences')
          const parsed = raw ? JSON.parse(raw) : {}
          const themeMode = ['system', 'dark', 'light'].includes(parsed.theme)
            ? parsed.theme
            : 'system'
          const localeMode = ['system', 'es', 'en'].includes(parsed.locale)
            ? parsed.locale
            : 'system'
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const theme = themeMode === 'system' ? (prefersDark ? 'dark' : 'light') : themeMode
          const locale =
            localeMode === 'system'
              ? (navigator.language || 'es').toLowerCase().startsWith('en')
                ? 'en'
                : 'es'
              : localeMode

          const root = document.documentElement
          root.classList.toggle('dark', theme === 'dark')
          root.classList.toggle('light', theme === 'light')
          root.dataset.theme = theme
          root.lang = locale

          const themeColor = document.querySelector('meta[name="theme-color"]')
          if (themeColor) {
            themeColor.setAttribute('content', theme === 'dark' ? '#0B0E14' : '#EDF0F8')
          }
        } catch {
          // Preferences are optional; keep the static dark defaults.
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
