    <title>Jonathan Campos — Desarrollador Frontend</title>
    <script>
      ;(() => {
        try {
          const raw = localStorage.getItem('ech:preferences')
          const parsed = raw ? JSON.parse(raw) : {}
          const themeMode = ['system', 'dark', 'light'].includes(parsed.theme)
            ? parsed.theme
            : 'system'
          const localeMode = ['system', 'es', 'en'].includes(parsed.locale)
            ? parsed.locale
            : 'system'
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const theme = themeMode === 'system' ? (prefersDark ? 'dark' : 'light') : themeMode
          const locale =
            localeMode === 'system'
              ? (navigator.language || 'es').toLowerCase().startsWith('en')
                ? 'en'
                : 'es'
              : localeMode

          const root = document.documentElement
          root.classList.toggle('dark', theme === 'dark')
          root.classList.toggle('light', theme === 'light')
          root.dataset.theme = theme
          root.lang = locale

          const themeColor = document.querySelector('meta[name="theme-color"]')
          if (themeColor) {
            themeColor.setAttribute('content', theme === 'dark' ? '#0B0E14' : '#EDF0F8')
          }
        } catch {
          // Preferences are optional; keep the static dark defaults.
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
