<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0E14" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Static Open Graph / Twitter Card fallbacks for social crawlers.
      Per-route values (title, description, image and JSON-LD) are still
      generated by `@unhead/vue` in `src/composables/useSeo.ts`; unhead
      reuses these tags during hydration instead of duplicating them.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jonathanech.dev/" />
    <meta property="og:title" content="Jonathan Campos - Desarrollador Web Frontend" />
    <meta
      property="og:description"
      content="Portafolio profesional. Especialista en Vue 3, Tailwind CSS y TypeScript."
    />
    <meta property="og:image" content="https://jonathanech.dev/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="2848" />
    <meta property="og:image:height" content="1504" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://jonathanech.dev/" />
    <meta name="twitter:title" content="Jonathan Campos - Desarrollador Web Frontend" />
    <meta
      name="twitter:description"
      content="Portafolio profesional. Especialista en Vue 3, Tailwind CSS y TypeScript."
    />
    <meta name="twitter:image" content="https://jonathanech.dev/og-image.jpg" />

    <title>Jonathan Campos — Desarrollador Web Frontend (Vue 3)</title>

    <!-- Applies the stored theme/locale before first paint to avoid a flash. -->
    <script>
      ;(() => {
        try {
          const raw = localStorage.getItem('ech:preferences')
          const parsed = raw ? JSON.parse(raw) : {}
          const themeMode = ['system', 'dark', 'light'].includes(parsed.theme)
            ? parsed.theme
            : 'system'
          const localeMode = ['system', 'es', 'en'].includes(parsed.locale)
            ? parsed.locale
            : 'system'
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const theme = themeMode === 'system' ? (prefersDark ? 'dark' : 'light') : themeMode
          const locale =
            localeMode === 'system'
              ? (navigator.language || 'es').toLowerCase().startsWith('en')
                ? 'en'
                : 'es'
              : localeMode

          const root = document.documentElement
          root.classList.toggle('dark', theme === 'dark')
          root.classList.toggle('light', theme === 'light')
          root.dataset.theme = theme
          root.lang = locale

          const themeColor = document.querySelector('meta[name="theme-color"]')
          if (themeColor) {
            themeColor.setAttribute('content', theme === 'dark' ? '#0B0E14' : '#EDF0F8')
          }
        } catch {
          // Preferences are optional; keep the static dark defaults.
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
